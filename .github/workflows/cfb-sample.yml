name: CFB dev build (temporary)
on:
  push:
    branches: [cfb-dev]
permissions:
  contents: write
jobs:
  dev:
    if: "!contains(github.event.head_commit.message, 'dev output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build
        env:
          NFLPICKS_OUT: devout
          NFLPICKS_HISTORY: devout/history/locked_picks.json
        run: python -m nflpicks.build
      - name: Commit dev output
        run: |
          git config user.name "picks-bot"; git config user.email "picks-bot@users.noreply.github.com"
          git add -f devout && git commit -m "dev output" && git push
